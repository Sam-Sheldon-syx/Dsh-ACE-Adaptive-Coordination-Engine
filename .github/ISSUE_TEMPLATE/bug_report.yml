name: Bug report
description: Report a reproducible problem
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, config (redacted) and minimal synthetic input.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node, DSH version, OS; do not include session IDs or credentials.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove local paths, session IDs, tokens and personal data.
    validations:
      required: false
